<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️</title>

    <link rel="stylesheet" href="styles/main.css">
</head>

<body>

    <div class="wallpaper"></div>

    <div class="content"></div>

    <div class="bg_heart">
        <div class="message"></div>

        <a href="love.html" class="next-button">
            pencet aku
        </a>
    </div>

    <audio id="backgroundMusic" loop preload="auto" autoplay muted playsinline>
        <source src="assets/Best Part.mp3" type="audio/mpeg">
    </audio>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="script/main.js"></script>

    <script>

        function setupMusic() {

            const music =
            document.getElementById('backgroundMusic');

            const isMusicPlaying =
            localStorage.getItem('musicPlaying') === 'true';

            const musicCurrentTime =
            localStorage.getItem('musicCurrentTime') || 0;

            if (isMusicPlaying) {

                music.currentTime =
                parseFloat(musicCurrentTime);
            }

            music.addEventListener('play', () => {

                localStorage.setItem(
                    'musicPlaying',
                    'true'
                );
            });

            music.addEventListener('pause', () => {

                localStorage.setItem(
                    'musicPlaying',
                    'false'
                );
            });

            setInterval(() => {

                localStorage.setItem(
                    'musicCurrentTime',
                    music.currentTime
                );

            }, 1000);

            document.addEventListener(
                'click',
                function startMusic() {

                    music.muted = false;

                    music.play().catch(error => {

                        console.log(
                            'Autoplay prevented',
                            error
                        );

                    });

                    document.removeEventListener(
                        'click',
                        startMusic
                    );
                }
            );
        }

        document.addEventListener(
            'DOMContentLoaded',
            setupMusic
        );

    </script>

</body>
</html>
